name: Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test game logic
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Enable KVM for release detector smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test MediaPipe in minified release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: cd android && ./gradlew :app:connectedReleaseAndroidTest --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-games-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload release test reports and R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics-${{ github.run_number }}
          path: |
            build/app/reports/androidTests/
            build/app/outputs/androidTest-results/
            build/app/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 14
